---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "pipeline_initialisation"
description: Validate the pipeline parameters and read the sample sheet
keywords:
  - initialisation
  - validation
  - samplesheet
components: []
input:
  - validate_params:
      type: boolean
      description: |
        Validate the parameters against nextflow_schema.json before starting.
  - input:
      type: file
      description: |
        Path to the comma-separated sample sheet.
      pattern: "*.csv"
  - reads:
      type: file
      description: |
        Path to the comma-separated sheet of read libraries, or null.
      pattern: "*.csv"
output:
  - samplesheet:
      type: list
      description: |
        Channel of validated sample sheet rows, `[ meta, assembly, bins, checkm2 ]`, with
        `meta.id` the assembly name and `[]` for the bins and CheckM2 report of an assembly
        given without bins. Relative paths are resolved against the launch directory, then
        against the directory of the sample sheet.
  - assemblies:
      type: file
      description: |
        assemblies.tsv, the kind (`single`, `co` or empty) and the samples of every assembly,
        from the `samples` column of the sample sheet.
      pattern: "assemblies.tsv"
  - reads:
      type: list
      description: |
        Channel of `[ meta, [ fastq ] ]`, one entry per read library, with the library id,
        sample, molecule, platform, strandedness and `single_end` in meta. Empty without
        `--reads`. No FastQ file is in two entries.
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
