---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "mmseqs_cluster"
description: Cluster proteins with MMseqs2 easy-cluster
keywords:
  - clustering
  - proteins
  - mmseqs2
tools:
  - "mmseqs2":
      description: Ultra fast and sensitive sequence search and clustering suite
      homepage: https://github.com/soedinglab/MMseqs2
      documentation: https://mmseqs.com/latest/userguide.pdf
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:mmseqs
input:
  - - meta:
        type: map
        description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
    - proteins:
        type: file
        description: Proteins in FASTA format, one or several files
output:
  clusters:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "*_cluster.tsv":
          type: file
          description: Representative and member of every clustered protein
          pattern: "*_cluster.tsv"
  rep_seq:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "*_rep_seq.fasta":
          type: file
          description: Cluster representatives
          pattern: "*_rep_seq.fasta"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
