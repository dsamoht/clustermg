---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bwamem2_mem"
description: Map one Illumina library, DNA or RNA, onto every assembly
keywords:
  - alignment
  - bam
  - short reads
tools:
  - "bwa-mem2":
      description: The next version of the bwa-mem algorithm in bwa, faster for the same alignments
      homepage: https://github.com/bwa-mem2/bwa-mem2
      documentation: https://github.com/bwa-mem2/bwa-mem2#usage
      licence: ["MIT"]
      identifier: biotools:bwa-mem2
  - "samtools":
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org
      documentation: http://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: Groovy Map of the read library, with `id`, `sample`, `molecule`, `platform`, `strandedness` and `single_end`
    - reads:
        type: file
        description: FastQ of the library, one file or two mates
        pattern: "*.{fq,fastq}{,.gz}"
    - index:
        type: directory
        description: bwa-mem2 index of the reference
        pattern: "bwa_index"
output:
  bam:
    - - meta:
          type: map
          description: Groovy Map of the read library, with `id`, `sample`, `molecule`, `platform`, `strandedness` and `single_end`
      - "*.bam":
          type: file
          description: Sorted alignments
          pattern: "*.bam"
      - "*.bam.bai":
          type: file
          description: BAM index
          pattern: "*.bam.bai"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
