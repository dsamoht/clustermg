---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bwamem2_index"
description: Index the mapping reference for the Illumina libraries
keywords:
  - index
  - alignment
  - short reads
tools:
  - "bwa-mem2":
      description: The next version of the bwa-mem algorithm in bwa, faster for the same alignments
      homepage: https://github.com/bwa-mem2/bwa-mem2
      documentation: https://github.com/bwa-mem2/bwa-mem2#usage
      licence: ["MIT"]
      identifier: biotools:bwa-mem2
input:
  - - meta:
        type: map
        description: Groovy Map, e.g. `[ id:'reference' ]`
    - reference:
        type: file
        description: Every contig of every assembly
        pattern: "*.fa"
output:
  index:
    - - meta:
          type: map
          description: Groovy Map, e.g. `[ id:'reference' ]`
      - "bwa_index":
          type: directory
          description: bwa-mem2 index, prefix `reference`
          pattern: "bwa_index"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
