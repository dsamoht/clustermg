---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "samtools_bedcov"
description: Count the reads and bases of a DNA library on every contig and linked stretch
keywords:
  - coverage
  - counts
  - bam
tools:
  - "samtools":
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org
      documentation: http://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: Groovy Map of the read library, with `id`, `sample`, `molecule`, `platform`, `strandedness` and `single_end`
    - bam:
        type: file
        description: Sorted alignments of the library
        pattern: "*.bam"
    - bai:
        type: file
        description: BAM index
        pattern: "*.bam.bai"
    - regions:
        type: file
        description: Contigs and linked stretches DNA is counted on
        pattern: "*.bed"
output:
  bedcov:
    - - meta:
          type: map
          description: Groovy Map of the read library, with `id`, `sample`, `molecule`, `platform`, `strandedness` and `single_end`
      - "*.bedcov.tsv":
          type: file
          description: Aligned bases, bases at depth 1 or more and reads of every region
          pattern: "*.bedcov.tsv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
