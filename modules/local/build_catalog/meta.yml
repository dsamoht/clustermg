---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "build_catalog"
description: Merge the clustering steps into one gene catalog, checking that final-MAG genes are only represented by final-MAG genes
keywords:
  - gene catalog
  - clustering
  - mag
tools:
  - "python":
      description: Helper script shipped in bin/
      homepage: https://www.python.org
      documentation: https://docs.python.org
      licence: ["PSF-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
    - gffs:
        type: file
        description: Gene coordinates of every assembly, `<assembly>.gff`
    - fnas:
        type: file
        description: Gene nucleotide sequences of every assembly, `<assembly>.fna`
    - faas:
        type: file
        description: Proteins of every assembly, `<assembly>.faa`
  - mag_clusters:
      type: file
      description: Cluster table of the final-MAG genes, or `[]`
  - assigned:
      type: file
      description: assigned.tsv written by ASSIGN_GENES
  - other_clusters:
      type: file
      description: Cluster table of the unassigned genes, or `[]`
  - contig2mag:
      type: file
      description: contig2mag.tsv tables of every assembly
  - mags_summary:
      type: file
      description: mags_summary.tsv written by SUMMARIZE_MAGS
output:
  faa:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "gene_catalog.faa":
          type: file
          description: Proteins of the representatives
          pattern: "gene_catalog.faa"
  fna:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "gene_catalog.fna":
          type: file
          description: Nucleotide sequences of the representatives
          pattern: "gene_catalog.fna"
  gff:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "gene_catalog.gff":
          type: file
          description: Coordinates of the representatives
          pattern: "gene_catalog.gff"
  clusters:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "gene_clusters.tsv":
          type: file
          description: Representative, origin and clustering step of every gene
          pattern: "gene_clusters.tsv"
  stats:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "gene_catalog_stats.tsv":
          type: file
          description: Counts of genes, representatives and final-MAG contigs
          pattern: "gene_catalog_stats.tsv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
