---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "minimap2_align"
description: Align sequences with minimap2, as a sorted BAM (a long-read library onto every assembly) or as a PAF (contigs onto contigs)
keywords:
  - alignment
  - bam
  - paf
  - long reads
tools:
  - "minimap2":
      description: A versatile pairwise aligner for genomic and spliced nucleotide sequences
      homepage: https://github.com/lh3/minimap2
      documentation: https://lh3.github.io/minimap2/minimap2.html
      licence: ["MIT"]
      identifier: biotools:minimap2
  - "samtools":
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org
      documentation: http://www.htslib.org/doc/samtools.html
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: Groovy Map, e.g. `[ id:'reference' ]`; a read library's has `id`, `sample`, `molecule`, `platform`, `single_end` and its minimap2 `preset`
    - reads:
        type: file
        description: Sequences to align, the FastQ of a library or contigs
        pattern: "*.{fq,fastq,fa,fasta}{,.gz}"
    - reference:
        type: file
        description: What they are aligned onto, the minimap2 index of the library's preset or contigs
        pattern: "*.{mmi,fa,fasta}"
  - bam_format:
      type: boolean
      description: true for a sorted, indexed BAM, false for a PAF
output:
  bam:
    - - meta:
          type: map
          description: Groovy Map of the read library, with its minimap2 `preset`
      - "*.bam":
          type: file
          description: Sorted alignments, with bam_format
          pattern: "*.bam"
      - "*.bam.bai":
          type: file
          description: BAM index
          pattern: "*.bam.bai"
  paf:
    - - meta:
          type: map
          description: Groovy Map, e.g. `[ id:'reference' ]`
      - "*.paf":
          type: file
          description: Alignments, without bam_format
          pattern: "*.paf"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
