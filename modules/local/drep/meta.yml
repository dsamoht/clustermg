---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "drep"
description: Dereplicate the MAGs that passed the quality filter with dRep
keywords:
  - dereplication
  - mag
  - ani
  - drep
tools:
  - "drep":
      description: Rapid comparison and dereplication of genomes
      homepage: https://github.com/MrOlm/drep
      documentation: https://drep.readthedocs.io
      licence: ["MIT"]
      identifier: biotools:drep
input:
  - - meta:
        type: map
        description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
    - passing:
        type: file
        description: File names of the MAGs to dereplicate
    - genome_info:
        type: file
        description: dRep genomeInfo table of those MAGs
  - mags:
      type: file
      description: Every MAG of the run in FASTA format
output:
  tables:
    - - meta:
          type: map
          description: Groovy Map naming the run-wide step, e.g. `[ id:'mags' ]`
      - "{Cdb,Ndb,Sdb,Wdb,Widb,genomeInformation}.csv":
          type: file
          description: dRep data tables - clusters, secondary comparisons, scores, winners and genome statistics
          pattern: "*.csv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
